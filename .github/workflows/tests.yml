name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Test
        run: pytest -v --cov=sbci --cov-report=term-missing

  clean-install:
    # The five-minute test starts from a blank environment, so the packaged
    # wheel has to import without the repository present.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Install the wheel and import from a different directory
        run: |
          python -m pip install dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          python -c "from sbci import ContinuousConnectome, load_atlas; print('import ok')"
          sbci --version

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
